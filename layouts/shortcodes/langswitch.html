<div class="langswitch" data-default="{{ (.Get "default") | default "en" }}" data-js-only>
  <span>{{ partial "t.html" (dict "en" "Read in" "pt" "Ler em") }}</span>
  <button type="button" data-global-lang="en" aria-pressed="true">English</button>
  <button type="button" data-global-lang="pt-br" aria-pressed="false">Português</button>
</div>
