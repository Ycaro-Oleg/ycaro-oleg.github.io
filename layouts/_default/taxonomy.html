{{ define "main" }}
<div class="container archive-page">
  <a class="text-link" href="{{ "/tags/" | relURL }}">{{ partial "t.html" (dict "en" "All topics" "pt" "Todos os assuntos") }}</a>
  <header class="topic-header"><h1>{{ .Title }}</h1></header>
  <ul class="post-list">{{ range .Pages.ByDate.Reverse }}{{ partial "post_row.html" . }}{{ end }}</ul>
</div>
{{ end }}
